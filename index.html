<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Feedback Interface</title>
  <style>
    :root { --bg: #111827; --fg: #e5e7eb; --muted:#9ca3af; --accent:#22d3ee; }
    html, body { margin:0; padding:0; background:var(--bg); color:var(--fg); font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, Noto Sans, "Apple Color Emoji","Segoe UI Emoji"; }
    .wrap { max-width: 760px; margin: 0 auto; padding: 24px; }
    .card { background: #0b1220; border:1px solid #1f2937; border-radius: 16px; padding: 20px 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.25); }
    h1, h2 { margin: 0 0 12px 0; }
    .muted { color: var(--muted); }
    .row { display:flex; align-items:center; gap:12px; }
    .badge { padding: 4px 10px; border-radius:999px; border:1px solid #334155; background:#0f172a; font-size: 12px; color:#cbd5e1;}
    .avatar { width:36px; height:36px; border-radius:999px; display:inline-flex; align-items:center; justify-content:center; background:#0f172a; border:1px solid #334155; }
    .avatar svg { width:20px; height:20px; color:#cbd5e1;}
    ul { margin: 14px 0 0 18px; padding:0; }
    li { margin: 8px 0; }
    .footer { display:flex; justify-content:space-between; align-items:center; margin-top:16px; }
    button { background: linear-gradient(90deg,#22d3ee,#60a5fa); color:#0b1220; border:none; padding:10px 16px; border-radius:10px; font-weight:600; cursor:not-allowed; opacity:0.6; }
    button.enabled { cursor:pointer; opacity:1; }
    .timer { font-variant-numeric: tabular-nums; color:#93c5fd; }
    .analyzing { margin-top:14px; padding:12px; border:1px dashed #334155; border-radius:12px; background:#0b1220; }
    .small { font-size: 12px;}
    .sr-only { position:absolute; left:-10000px; top:auto; width:1px; height:1px; overflow:hidden; }
    a { color:#93c5fd; }
    .hidden { display:none; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card" id="stage-intro">
      <div class="row">
        <div class="avatar" id="avatar"></div>
        <div class="badge" id="badge">Source</div>
      </div>
      <h1 id="header">Feedback source</h1>
      <p class="muted" id="intro">Intro text.</p>
      <div class="analyzing" id="analyzing">
        <strong>Preparing feedback…</strong>
        <div class="small muted">Please wait <span class="timer" id="holdLeft">--</span> seconds.</div>
      </div>
      <div class="footer">
        <span class="muted small">You will be able to continue shortly.</span>
        <button id="toFeedback" disabled>Continue</button>
      </div>
    </div>

    <div class="card hidden" id="stage-feedback">
      <div class="row">
        <div class="avatar" id="avatar2"></div>
        <div class="badge" id="badge2">Source</div>
      </div>
      <h2 id="header2">Feedback</h2>
      <p class="muted">Please read carefully. You will be asked to recall these comments later.</p>
      <ul id="bullets"></ul>
      <div class="footer">
        <span class="muted small">Minimum viewing time: <span class="timer" id="minLeft">--</span>s</span>
        <button id="toQualtrics" disabled>Continue</button>
      </div>
    </div>
  </div>

<script>
  // --- Utilities ---
  function qp(key, fallback=null){ const v=new URLSearchParams(location.search).get(key); return v===null?fallback:v; }
  function pad(n){ return String(n).padStart(2,'0'); }

  // --- Params from Qualtrics ---
  const COND = (qp('cond','ai')||'ai').toLowerCase();          // 'human' | 'ai'
  const RAND = qp('rand','0') === '1';                          // 0 fixed alt order
  const HOLD = parseInt(qp('hold','15'),10);                    // seconds analyzing hold
  const MINV = parseInt(qp('minView','30'),10);                 // seconds minimum viewing
  const PID  = qp('pid','');
  //const RETURN_URL = decodeURIComponent(qp('return',''));
  // NEW (robust): use return param if present, otherwise document.referrer, otherwise stay empty
const RETURN_URL_RAW = qp('return', qp('ret',''));
let RETURN_URL = '';
try {
  RETURN_URL = RETURN_URL_RAW ? decodeURIComponent(RETURN_URL_RAW) : '';
} catch(e) {
  RETURN_URL = RETURN_URL_RAW || '';
}
if (!RETURN_URL && document.referrer) {
  RETURN_URL = document.referrer;
}
console.log('[PilotA] Params in:', { PID, COND, RAND, HOLD, MINV, RETURN_URL });
  // --- DOM refs ---
  const stageIntro = document.getElementById('stage-intro');
  const stageFeedback = document.getElementById('stage-feedback');
  const badge = document.getElementById('badge');
  const header = document.getElementById('header');
  const intro = document.getElementById('intro');
  const avatar = document.getElementById('avatar');
  const holdLeft = document.getElementById('holdLeft');
  const toFeedback = document.getElementById('toFeedback');

  const badge2 = document.getElementById('badge2');
  const header2 = document.getElementById('header2');
  const avatar2 = document.getElementById('avatar2');
  const bullets = document.getElementById('bullets');
  const minLeft = document.getElementById('minLeft');
  const toQualtrics = document.getElementById('toQualtrics');

  // --- Source framing content ---
  const content = {
    human: {
      badge: 'Feedback from another participant',
      header: 'Feedback from another participant',
      intro: 'The feedback below was written by a prior participant after reviewing your responses.',
      icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 12a5 5 0 1 0-5-5 5 5 0 0 0 5 5Zm0 2c-4.33 0-8 2.17-8 5v1h16v-1c0-2.83-3.67-5-8-5Z"/></svg>'
    },
    ai: {
      badge: 'Feedback from an AI system',
      header: 'Feedback from an AI system',
      intro: 'The feedback below was generated by an AI system that analyzes response quality.',
      icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 2l3 3-3 3-3-3 3-3Zm0 6v8m-4 4h8m3-7h2m-18 0h2m12-8h2m-16 0h2"/></svg>'
    }
  };

  // --- Feedback items (4 positive, 4 negative) ---
  const POS = [
    "You interpreted the patterns in a clear and organized way.",
    "Your reasoning showed effective use of evidence from the prompt.",
    "You identified relevant features that many respondents overlook.",
    "Your summary conveyed the main conclusion accurately and concisely."
  ];
  const NEG = [
    "You overlooked subtle patterns that would strengthen your conclusion.",
    "Your justification did not connect claims to specific observations.",
    "You missed alternative explanations that challenge the initial inference.",
    "Your summary omitted qualifiers that affect the argument’s accuracy."
  ];

  // Build order
  let order = [];
  if (RAND){
    const all = POS.map((t,i)=>({t, v:'positive', oi:i})).concat(NEG.map((t,i)=>({t, v:'negative', oi:i})));
    order = all.sort(()=>Math.random()-0.5);
  } else {
    for (let i=0;i<4;i++){
      order.push({t: POS[i], v:'positive', oi:i});
      order.push({t: NEG[i], v:'negative', oi:i});
    }
  }

  // --- Render helpers ---
  function setFraming(elBadge, elHeader, elIntro, elAvatar, kind){
    const c = content[kind];
    elBadge.textContent = c.badge;
    elHeader.textContent = c.header;
    if (elIntro) elIntro.textContent = c.intro;
    elAvatar.innerHTML = c.icon;
  }

  // stage: intro / analyzing hold
  setFraming(badge, header, intro, avatar, (COND==='human'?'human':'ai'));
  let hold = HOLD;
  holdLeft.textContent = hold;
  const holdTimer = setInterval(()=>{
    hold -= 1;
    holdLeft.textContent = hold;
    if (hold <= 0){
      clearInterval(holdTimer);
      toFeedback.classList.add('enabled');
      toFeedback.disabled = false;
      document.querySelector('.footer span').textContent = "You may continue.";
      toFeedback.style.cursor = 'pointer';
    }
  }, 1000);

  let feedbackStart = null;
  let firstInteraction = null;
  document.addEventListener('click', () => { if (feedbackStart && !firstInteraction) firstInteraction = Date.now(); }, true);
  document.addEventListener('keydown', () => { if (feedbackStart && !firstInteraction) firstInteraction = Date.now(); }, true);

  toFeedback.addEventListener('click', ()=>{
    stageIntro.classList.add('hidden');
    stageFeedback.classList.remove('hidden');
    setFraming(badge2, header2, null, avatar2, (COND==='human'?'human':'ai'));

    // render bullets
    bullets.innerHTML = '';
    order.forEach((o)=>{
      const li = document.createElement('li');
      li.textContent = o.t;
      bullets.appendChild(li);
    });

    feedbackStart = Date.now();
    let left = MINV;
    minLeft.textContent = left;
    const mvTimer = setInterval(()=>{
      left -= 1;
      minLeft.textContent = left;
      if (left <= 0){
        clearInterval(mvTimer);
        toQualtrics.classList.add('enabled');
        toQualtrics.disabled = false;
        toQualtrics.style.cursor = 'pointer';
      }
    }, 1000);
  });

  toQualtrics.addEventListener('click', ()=>{
  const end = Date.now();
  const viewSecs = ((end - feedbackStart)/1000).toFixed(2);
  const tFirst = firstInteraction ? ((firstInteraction - feedbackStart)/1000).toFixed(2) : '';

  const compact = order.map((o,idx)=>[idx, o.v[0], o.oi].join('|')).join(';');

  if (RETURN_URL) {
    const glue = RETURN_URL.includes('?') ? '&' : '?';
    const dest = `${RETURN_URL}${glue}pid=${encodeURIComponent(PID)}&cond=${encodeURIComponent(COND)}&fv_time=${encodeURIComponent(viewSecs)}&first_interaction=${encodeURIComponent(tFirst)}&item_order=${encodeURIComponent(compact)}`;
    window.location.assign(dest);
  } else {
    // Fallback: go back to previous page if no return URL was provided
    if (document.referrer) {
      window.location.assign(document.referrer);
    } else {
      window.history.back();
    }
  }
});

</script>
</body>
</html>
